<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <title>D & K Admin Dashboard</title>
    </head>
    <body>
        <h1>Admin Dashboard</h1>
        <main class="container">
            <h2>Media Management</h2>
            <div class="grid">
                <button id="deleteMedia">Delete All Media</button>
                <button id="syncManifest">Sync Manifest</button>
                <button disabled id="deleteImages">Delete All Images</button>
                <button disabled id="deleteVideos">Delete All Videos</button>
            </div>
            <b>
                <p id="log"></p>
            </b>
        </main>
    </body>
    <script>
    const deleteImages = document.getElementById("deleteImages");
    const deleteVideos = document.getElementById("deleteVideos");
    const deleteMedia = document.getElementById("deleteMedia");
    const syncManifest = document.getElementById("syncManifest");
    const log = document.getElementById("log");

    deleteMedia.addEventListener("click", async () => {
      if (confirm("Are you sure that you want to delete all media?")) {
        log.textContent = "Deletion process started...";
        log.ariaBusy = "true";
        deleteMedia.ariaBusy = "true";
        try {
          const response = await fetch("/api/delete-all", { method: "POST" });
          const result = await response.text();
          log.textContent = result;
          log.ariaBusy = "false";
          deleteMedia.ariaBusy = "false";
        } catch (error) {
          log.textContent = "An error occurred: " + error.message;
          console.error("Fetch error:", error);
          log.ariaBusy = "false";
          deleteMedia.ariaBusy = "false";
        }
      }
    });

    syncManifest.addEventListener("click", async () => {
      if (confirm("You are about to sync the media manifest. Continue?")) {
        log.textContent = "Sync process started...";
        syncManifest.ariaBusy = "true";
        try {
          const response = await fetch("/api/sync-media", { method: "POST" });
          const result = await response.text();
          log.textContent = result;
          log.ariaBusy = "false";
          syncManifest.ariaBusy = "false";
        } catch (error) {
          log.textContent = "An error occurred: " + error.message;
          log.ariaBusy = "false";
          syncManifest.ariaBusy = "false";
          console.error("Fetch error:", error);
        }
      }
    });
    </script>
</html>
