name: Build

on:
  workflow_dispatch:

jobs:
  build:
    environment: CLOUDFLARE
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: "Create env file"
        run: |
          touch .env
          echo CLOUDFLARE_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }} > .env
          echo CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }} > .env
          cat .env

      - name: Install dependencies
        run: pnpm install

      - name: Sync Media
        run: pnpm sync-media

      - name: Build project
        run: pnpm run build
