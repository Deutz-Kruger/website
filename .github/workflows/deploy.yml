name: Deploy Dev

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  build:
    name: Build project
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy with wrangler
        run: wrangler deploy
