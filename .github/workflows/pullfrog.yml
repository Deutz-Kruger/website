# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.MISTRAL_API_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.MISTRAL_MODEL }}
          OPENAI_COMPATIBLE_CONTEXT: ${{ vars.MISTRAL_CONTEXT_WINDOW }}
          OPENAI_COMPATIBLE_MAX_OUTPUT: ${{ vars.MISTRAL_MAX_OUTPUT_TOKENS }}
